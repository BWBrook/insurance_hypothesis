default_profile: ih_draft

profiles:
  ih_draft:
    description: Insurance hypothesis drafting profile (scoped lint for iterative writing)
    manuscript_sources:
      - ../manuscript/text/draft_ms_v2.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/figures.md
    lint_sources:
      - ../manuscript/text/tables.md
      - ../manuscript/text/figures.md

    author_metadata: ../manuscript/authors.yaml
    bibliography: ../references/ih_references.yaml
    csl: ../csl/oikos.csl
    journal: Oikos
    csl_search_dirs:
      - ../csl
      - csl

    output_dir: dist
    output_stem: insurance_hypothesis_draft

    page_numbers: lower_right
    line_spacing: 1.5
    line_numbering: continuous

    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures

    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 2.5
      bottom: 2.0
      left: 2.5

  ih_submission:
    description: Insurance hypothesis strict submission profile (full lint gate)
    manuscript_sources:
      - ../manuscript/text/draft_ms_v2.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/figures.md
    lint_sources:
      - ../manuscript/text/draft_ms_v2.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/figures.md

    author_metadata: ../manuscript/authors.yaml
    bibliography: ../references/ih_references.yaml
    csl: ../csl/oikos.csl
    journal: Oikos
    csl_search_dirs:
      - ../csl
      - csl

    output_dir: dist
    output_stem: insurance_hypothesis_submission

    page_numbers: lower_right
    line_spacing: 1.5
    line_numbering: continuous

    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures

    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 2.5
      bottom: 2.0
      left: 2.5

    golden_contract: ../expected/golden_contract.yaml
