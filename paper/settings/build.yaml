      - csl

    output_dir: dist
    output_stem: insurance_hypothesis_blinded_main

    page_numbers: lower_right
    line_spacing: 1.5
    line_numbering: continuous

    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures

    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 2.5
      bottom: 2.0
      left: 2.5

    golden_contract: ../expected/golden_contract.yaml

  ih_supplementary_info:
    description: Insurance hypothesis anonymous supplementary information profile
