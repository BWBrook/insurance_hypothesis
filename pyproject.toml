[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-hypothesis"
version = "0.1.0"
description = "Simulations for insurance hypothesis under environmental variability"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Barry W. Brook"}]
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "matplotlib>=3.9",
]

[tool.setuptools]
package-dir = {"" = "src/python"}
packages = ["insurance_sim"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pyright]
exclude = ["build", ".venv", "analysis/prespecified"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.3",
]
